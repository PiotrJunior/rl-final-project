[project]
name = "latentmine"
version = "0.1.0"
description = "Contrastive RL latent mining - what does a CRL critic encode about its maze?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "matplotlib",
  "pyyaml",
]

[project.optional-dependencies]
# Training and anything that touches the encoders needs the pinned upstream,
# installed separately from third_party/JaxGCRL. Kept out of the base deps so
# that `mazes` and `analysis` stay importable (and testable) without JAX.
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs JAX/brax or a training run; excluded from the fast check",
]

# Matches upstream JaxGCRL's config so the two codebases read the same.
[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Same reason as the lint ignores above: keep the vendored copy diffable.
exclude = ["src/latentmine/train/crl_resumable.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Vendored derivative of upstream's train_fn. Kept in upstream's style so it
# stays diffable against the pinned commit; restyling it would make the copy
# impossible to review. Only style rules are waived - E501/E731 line length and
# lambdas, UP modernisation. F (undefined names, unused imports), the rest of
# E, B and I stay enforced, and F821 is what caught a missing import in the
# first extraction.
"src/latentmine/train/crl_resumable.py" = ["E731", "E501", "UP"]
